<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>To Do List Kegiatan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        input, button {
            padding: 8px;
            margin: 5px;
        }

        ul {
            margin-top: 20px;
            padding: 0;
        }

        li {
            list-style: none;
            margin: 8px 0;
            padding: 10px;
            border: 1px solid #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .selesai {
            text-decoration: line-through;
            color: gray;
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<h2>To Do List Kegiatan</h2>

<form id="todoForm">
    <input type="text" id="namaKegiatan" placeholder="Nama Kegiatan" required>
    <input type="date" id="tanggal" required>
    <button type="submit">Tambah</button>
</form>

<ul id="todoList"></ul>

<script>
    const form = document.getElementById("todoForm");
    const namaInput = document.getElementById("namaKegiatan");
    const tanggalInput = document.getElementById("tanggal");
    const list = document.getElementById("todoList");

    form.addEventListener("submit", function(e) {
        e.preventDefault();

        const nama = namaInput.value;
        const tanggal = tanggalInput.value;

        const li = document.createElement("li");

        const info = document.createElement("span");
        info.textContent = nama + " | " + tanggal;

        const btnSelesai = document.createElement("button");
        btnSelesai.textContent = "Selesai";

        const btnHapus = document.createElement("button");
        btnHapus.textContent = "Hapus";

        // Fungsi selesai
        btnSelesai.onclick = function() {
            li.classList.toggle("selesai");
        };

        // Fungsi hapus
        btnHapus.onclick = function() {
            li.remove();
        };

        li.appendChild(info);
        li.appendChild(btnSelesai);
        li.appendChild(btnHapus);
        list.appendChild(li);

        // Reset input
        namaInput.value = "";
        tanggalInput.value = "";
    });
</script>

</body>
</html>
